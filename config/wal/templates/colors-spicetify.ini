[Sleek]
# Main text color
text               = {foreground.strip}
# Secondary text (less important info)
subtext            = {color7.strip}
# The primary background
main               = {background.strip}
# Slightly different color for UI depth
main-elevated      = {color0.strip}
# Hover colors
highlight          = {color8.strip}
highlight-elevated = {color8.strip}
# Sidebar should usually match the main or be slightly darker
sidebar            = {background.strip}
# Bottom player bar
player             = {background.strip}
# Cards and popups
card               = {color0.strip}
shadow             = {color0.strip}
# Selected song/row
selected-row       = {color8.strip}
# Buttons (Using your accent color4)
button             = {color4.strip}
button-active      = {color4.strip}
button-disabled    = {color8.strip}
tab-active         = {color4.strip}
# Feedback colors
notification       = {color2.strip}
notification-error = {color1.strip}
misc               = {color5.strip}

[Base]
# Keep Base identical to Sleek for compatibility
text               = {foreground.strip}
subtext            = {color7.strip}
main               = {background.strip}
main-elevated      = {color0.strip}
highlight          = {color8.strip}
highlight-elevated = {color8.strip}
sidebar            = {background.strip}
player             = {background.strip}
card               = {color0.strip}
shadow             = {color0.strip}
selected-row       = {color8.strip}
button             = {color4.strip}
button-active      = {color4.strip}
button-disabled    = {color8.strip}
tab-active         = {color4.strip}
notification       = {color2.strip}
notification-error = {color1.strip}
misc               = {color5.strip}